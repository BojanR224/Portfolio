server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — every route resolves to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}